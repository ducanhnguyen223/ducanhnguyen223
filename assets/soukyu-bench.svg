<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="194" viewBox="0 0 1000 194" role="img" aria-labelledby="title desc"><title id="title">LLM Reliability &amp; Cache Bench — CACHE &amp; EVALUATION</title><desc id="desc">LLM Reliability &amp; Cache Bench. Tests whether a cached answer is still safe after its context or permissions change. Python · Evaluation · Cache invalidation. PUBLIC / OFFLINE. Reproducible cases · exact / semantic / dependency-aware.</desc><defs><style>
text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}
.reveal{animation:reveal var(--duration) steps(32,end) var(--delay) both}
.remaining{animation:remaining var(--duration) steps(32,end) var(--delay) both}
.noise{animation:finish .001s calc(var(--delay) + var(--duration)) forwards}
.noise-0{animation:n0 .21s steps(1,end) infinite}.noise-1{animation:n1 .21s steps(1,end) infinite}.noise-2{animation:n2 .21s steps(1,end) infinite}
.meter{transform-box:fill-box;transform-origin:left;animation:meter 1.25s cubic-bezier(.2,.8,.2,1) .45s both}
.orbit{transform-origin:875px 119px;animation:orbit 28s linear infinite}
.trace{stroke-dasharray:10 250;animation:trace 6s linear infinite}
@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes remaining{from{transform:translateX(0)}to{transform:translateX(var(--span))}}
@keyframes finish{to{opacity:0;visibility:hidden}}
@keyframes n0{0%,32%{opacity:.7}33%,100%{opacity:0}}@keyframes n1{0%,32%{opacity:0}33%,65%{opacity:.7}66%,100%{opacity:0}}@keyframes n2{0%,65%{opacity:0}66%,100%{opacity:.7}}
@keyframes meter{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes trace{to{stroke-dashoffset:-260}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.noise{display:none}.reveal{transform:none}}
