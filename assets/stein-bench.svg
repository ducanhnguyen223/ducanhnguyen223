text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}
.reveal{animation:reveal var(--duration) steps(32,end) var(--delay) both}
.remaining{animation:remaining var(--duration) steps(32,end) var(--delay) both}
.noise{animation:finish .001s calc(var(--delay) + var(--duration)) forwards}
.noise-0{animation:noise0 .24s steps(1,end) infinite}.noise-1{animation:noise1 .24s steps(1,end) infinite}.noise-2{animation:noise2 .24s steps(1,end) infinite}
.orbit{transform-origin:900px 118px;animation:orbit 26s linear infinite}
@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes remaining{from{transform:translateX(0)}to{transform:translateX(var(--span))}}
@keyframes finish{to{opacity:0;visibility:hidden}}
@keyframes noise0{0%,32%{opacity:.82}33%,100%{opacity:0}}
@keyframes noise1{0%,32%{opacity:0}33%,65%{opacity:.82}66%,100%{opacity:0}}
@keyframes noise2{0%,65%{opacity:0}66%,100%{opacity:.82}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.reveal,.remaining,.noise,.noise-0,.noise-1,.noise-2,.orbit{animation:none}.noise{display:none}.reveal{transform:none}}
</style></defs>
