<title id="title">LLM Reliability &amp; Cache Bench</title><desc id="desc">03 / SELECTED WORK. OFFLINE EVALUATION TOOLKIT. Tests when a cached LLM answer can still be reused after its context changes.. Replays changes in source data, permissions and policy. Explores cache correctness and the limits of semantic similarity.. Python · Evaluation · Cache invalidation. EXPLORE REPOSITORY ↗</desc>
