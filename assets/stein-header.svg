<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="260" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc">
  <title id="title">Albert anhstein — AI Engineer</title>
  <desc id="desc">STEIN. LLM applications, retrieval and agent tooling. A white and blue banner with a rotating orbital mark and a typing line.</desc>
  <defs>
    <clipPath id="typing"><rect class="reveal" x="46" y="193" width="600" height="39"/></clipPath>
    <style>
      text{font-family:"Avenir Next","Segoe UI",Arial,sans-serif}
      .mono{font-family:Menlo,Consolas,monospace}
      .orbit{transform-origin:862px 131px;animation:orbit 26s linear infinite}
      .reveal{transform-origin:46px 0;animation:typing 4s steps(36,end) infinite}
      .line1{animation:line1 12s steps(1,end) infinite}
      .line2{opacity:0;animation:line2 12s steps(1,end) infinite}
      .line3{opacity:0;animation:line3 12s steps(1,end) infinite}
      .signal{animation:signal 3s ease-in-out infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes typing{0%{transform:scaleX(0)}38%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
      @keyframes line1{0%,32.99%{opacity:1}33%,100%{opacity:0}}
      @keyframes line2{0%,32.99%{opacity:0}33%,65.99%{opacity:1}66%,100%{opacity:0}}
      @keyframes line3{0%,65.99%{opacity:0}66%,100%{opacity:1}}
      @keyframes signal{0%,100%{opacity:.45}50%{opacity:1}}
      @media(max-width:600px){.ornament{opacity:.22}.name{font-size:72px}.role{font-size:28px}.typing-text{font-size:25px}}
      @media(prefers-reduced-motion:reduce){.orbit,.reveal,.line1,.line2,.line3,.signal{animation:none}.reveal{transform:none}.line1{opacity:1}.line2,.line3{opacity:0}}
    </style>
  </defs>
  <rect width="1040" height="260" fill="#edf0f2"/>
  <path d="M729 0H1040V260H873L686 72Z" fill="#e4e8ec"/>
  <path d="M911 0H1040V260H996L859 63Z" fill="#dce4ec"/>
  <rect width="5" height="260" fill="#2770c4"/>
  <path d="M28 28h12M28 28v12M1012 28h-12M1012 28v12M28 232h12M28 232v-12M1012 232h-12M1012 232v-12" fill="none" stroke="#94afc9"/>
  <text x="46" y="43" font-size="17" font-weight="700" letter-spacing="4" fill="#2770c4">STEIN</text>
  <path d="M125 29v17" stroke="#b8c4d0"/>
  <text x="140" y="42" class="mono" font-size="12" letter-spacing="1.6" fill="#556a7e">APPLIED INTELLIGENCE</text>
  <text x="43" y="119" class="name" font-size="67" font-weight="650" letter-spacing="-2.8" fill="#192a3c">Albert anhstein<tspan fill="#2770c4">.</tspan></text>
  <text x="46" y="164" class="role" font-size="24" font-weight="600" letter-spacing="2" fill="#2770c4">AI ENGINEER / LLM SYSTEMS</text>
  <g clip-path="url(#typing)" class="mono typing-text" font-size="21" fill="#4d6276">
    <text x="46" y="221" class="mono line1">From language models to useful systems.</text>
    <text x="46" y="221" class="mono line2">Context. Retrieval. Tools. Evaluation.</text>
    <text x="46" y="221" class="mono line3">Build with evidence. Keep control.</text>
  </g>
  <g class="ornament">
    <g fill="none" stroke="#bbcbda" stroke-width=".8">
      <circle cx="862" cy="131" r="94"/><circle cx="862" cy="131" r="73"/>
      <path d="M750 131h224M862 22v218" stroke-dasharray="2 7"/>
      <ellipse cx="862" cy="131" rx="45" ry="94"/>
    </g>
    <g class="orbit" fill="none">
      <ellipse cx="862" cy="131" rx="109" ry="45" stroke="#2770c4" stroke-width="1.5" transform="rotate(-30 862 131)"/>
      <circle cx="956.4" cy="76.5" r="4" fill="#2770c4"/>
      <circle cx="767.6" cy="185.5" r="3" fill="#79262b"/>
    </g>
    <g transform="translate(794 63) scale(1.95)" fill="#2770c4">
      <path d="M49 14H26L13 30l28 11 7-9-19-7h14z"/>
      <path d="M21 56h23l13-16-28-11-7 9 19 7H27z" fill="#204a79"/>
    </g>
    <path d="M764 48h19M764 48v19M960 214h-19M960 214v-19" fill="none" stroke="#2770c4" stroke-width="2"/>
    <rect x="943" y="224" width="7" height="7" fill="#79262b" class="signal"/>
    <path d="M955 227.5h24" stroke="#79262b"/>
  </g>
</svg>
