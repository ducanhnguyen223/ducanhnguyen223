<title id="title">VanBanAI</title><desc id="desc">04 / IN DEVELOPMENT · PRIVATE. VIETNAMESE DOCUMENT WORKFLOWS. Connects retrieval, structured drafting, review and Word/PDF export.. Structured facts and source references guide the model. Legal-source validation and release work are ongoing.. retrieve → draft → review → export</desc>
